name: Service CI

on:
  workflow_call:

    inputs:
      service_name:
        description: "Name of the service"
        required: true
        type: string

      environment:
        description: "Deployment environment"
        required: true
        type: string

jobs:

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ inputs.service_name }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ inputs.service_name }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run pylint
        working-directory: services/${{ inputs.service_name }}
        run: |
          pylint .


  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ inputs.service_name }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ inputs.service_name }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run tests
        working-directory: services/${{ inputs.service_name }}
        run: |
          pytest


  security:
    name: Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/${{ inputs.service_name }}/requirements.txt

      - name: Install dependencies
        working-directory: services/${{ inputs.service_name }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Dependency audit
        working-directory: services/${{ inputs.service_name }}
        run: |
          pip-audit


  build-scan-push:
    name: Build and scan image

    needs:
      - lint
      - test
      - security

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t ${{ inputs.service_name }}:${{ github.sha }} services/${{ inputs.service_name }}

      - name: Scan Docker image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ${{ inputs.service_name }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

      # AWS authentication will be finalized
      # when we configure GitHub OIDC.

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag image
        run: |
          docker tag ${{ inputs.service_name }}:${{ github.sha }} ${{ vars.ECR_REGISTRY }}/${{ inputs.service_name }}:${{ github.sha }}

      - name: Push image to ECR
        run: |
          docker push ${{ vars.ECR_REGISTRY }}/${{ inputs.service_name }}:${{ github.sha }}


  gitops-update:
    name: Update GitOps repository

    needs: build-scan-push

    runs-on: ubuntu-latest

    concurrency:
      group: gitops-${{ inputs.environment }}
      cancel-in-progress: false

    steps:
      - name: Checkout GitOps repository
        uses: actions/checkout@v4
        with:
          repository: YOUR_GITHUB_USERNAME/microservices-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          ref: main

      - name: Install yq
        uses: mikefarah/yq@v4.45.1

      - name: Update image tag
        env:
          IMAGE_TAG: ${{ github.sha }}
          SERVICE_NAME: ${{ inputs.service_name }}
        run: | # We need to update the image tag in the values.yaml file for the service in the GitOps repository. We can use yq to do this.
          yq -i '.image.tag = strenv(IMAGE_TAG)' "services/${SERVICE_NAME}/values.yaml"

      - name: Show changes
        run: |
          git diff

      - name: Commit changes
        env:
          SERVICE_NAME: ${{ inputs.service_name }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "chore: update ${SERVICE_NAME} image to ${IMAGE_TAG}"

      - name: Push changes
        run: |
          git push origin HEAD:main