<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskFlow &mdash; Service status</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-shell" id="app-shell">
    <main class="main">
      <div class="page-header">
        <p class="eyebrow">health-service</p>
        <h1>Service status</h1>
        <p>health-service pings every microservice's <code>/health</code> endpoint on each refresh and reports whether it responded, and how fast.</p>
      </div>

      <div class="status-summary">
        <div class="status-ring" id="status-ring">&mdash;</div>
        <div class="status-summary-text">
          <p class="status-headline" id="status-headline">Checking services…</p>
          <p class="status-sub" id="status-sub">&nbsp;</p>
        </div>
      </div>

      <div class="service-grid" id="service-grid"></div>

      <p class="status-footer-note">
        <span class="refresh-indicator"></span>
        Auto-refreshing every 5 seconds &middot; last checked <span id="last-checked">&mdash;</span>
      </p>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/nav.js"></script>
  <script>
    TaskFlow.requireAuth();
    renderNav("status");

    const REFRESH_MS = 5000;
    const grid = document.getElementById("service-grid");

    function describe(name) {
      const map = {
        "gateway-service": "Routes every /api request to the right service",
        "auth-service": "Registration, login, and token issuing",
        "user-service": "Profile storage",
        "task-service": "Task CRUD and the source of truth for analytics",
        "category-service": "Task categories",
        "notification-service": "Reminders raised by task-service",
        "analytics-service": "Aggregates task-service data on request",
        "health-service": "Checks every service above, including itself",
      };
      return map[name] || "";
    }

    function render(data) {
      const { services, healthy_services, total_services } = data;
      const allUp = healthy_services === total_services;

      const ring = document.getElementById("status-ring");
      ring.textContent = `${healthy_services}/${total_services}`;
      ring.style.borderColor = allUp ? "var(--up)" : (healthy_services === 0 ? "var(--down)" : "var(--degraded)");
      ring.style.color = ring.style.borderColor;

      document.getElementById("status-headline").textContent = allUp
        ? "All systems operational"
        : `${total_services - healthy_services} of ${total_services} services need attention`;
      document.getElementById("status-sub").textContent =
        "Checked via health-service, which calls each service's own /health endpoint.";
      document.getElementById("last-checked").textContent = new Date(data.checked_at * 1000).toLocaleTimeString();

      grid.innerHTML = "";
      services.forEach(s => {
        const card = document.createElement("div");
        card.className = `service-card status-${s.status}`;
        const latencyPct = Math.max(4, Math.min(100, Math.round((s.latency_ms / 50) * 100)));
        card.innerHTML = `
          <div class="service-card-top">
            <div>
              <div class="service-name">${s.name}</div>
              <div class="service-url">${s.url}</div>
            </div>
            <div class="pulse-dot"></div>
          </div>
          <p style="font-size:12px;color:var(--text-muted);margin:0;">${describe(s.name)}</p>
          <div class="service-meta-row">
            <span class="pill pill-${s.status === "up" ? "completed" : s.status === "degraded" ? "pending" : "in_progress"}" style="border-color:transparent;padding:0;">${s.status}</span>
            <div class="latency-bar"><div class="latency-fill" style="width:${s.status === "down" ? 0 : latencyPct}%"></div></div>
            <span class="latency-value">${s.status === "down" ? "timeout" : s.latency_ms + "ms"}</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    async function poll() {
      try {
        const data = await TaskFlow.request("/health");
        render(data);
      } catch (err) {
        document.getElementById("status-headline").textContent = "Can't reach health-service";
        document.getElementById("status-sub").textContent = err.message;
      }
    }

    poll();
    setInterval(poll, REFRESH_MS);
  </script>
</body>
</html>
